[package]
name = "buzz-vim"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-first, vim-style terminal client for Buzz"
repository = "https://github.com/lucianearth/buzz-vim"
license = "MIT"

[workspace]
members = [".", "core", "ffi"]
default-members = [".", "core", "ffi"]

[dependencies]
buzz-vim-core = { path = "core" }
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
rpassword = "7.5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
unicode-width = "0.2.2"
nostr = { version = "0.44", features = ["nip44", "nip98"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
buzz-core = { git = "https://github.com/block/buzz", rev = "5397ea49e27fd56d4e0346e2120906d09ac91579" }
buzz-sdk = { git = "https://github.com/block/buzz", rev = "5397ea49e27fd56d4e0346e2120906d09ac91579" }
buzz-ws-client = { git = "https://github.com/block/buzz", rev = "5397ea49e27fd56d4e0346e2120906d09ac91579" }
uuid = "1.28.0"

[profile.release]
lto = "thin"
strip = true
